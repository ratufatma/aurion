[package]
name = "aurion-network"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
# Aurion Workspace Primitives & Core
aurion-primitives = { path = "../aurion-primitives" }
aurion-core       = { path = "../aurion-core" }

# Wire-protocol integrity (canonical 52-byte frame checksum)
blake3 = "1.5"

# Decentralized P2P Transport (Eclipse Zenoh — brokerless peer mesh)
# transport_tcp is the portable baseline; shared-memory adds zero-copy IPC.
# transport_quic is intentionally NOT enabled: it requires a C toolchain to
# build the ring/quinn QUIC stack, which is unavailable on this machine.
zenoh = { version = "1.1", default-features = false, features = ["transport_tcp", "shared-memory"] }

# Async runtime & concurrency
tokio   = { version = "1", features = ["sync", "rt", "macros", "time"] }
futures = "0.3"

# Logging & error handling
tracing    = "0.1"
thiserror  = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }